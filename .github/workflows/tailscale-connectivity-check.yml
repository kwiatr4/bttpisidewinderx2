name: Tailscale connectivity check

on:
  workflow_dispatch:
    inputs:
      target_host:
        description: "Host w tailnecie do sprawdzenia (np. raspberrypi.tailnet-name.ts.net)"
        required: true
        type: string

jobs:
  check-tailnet-access:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Check connectivity to target host
        shell: bash
        run: |
          target_host="${{ github.event.inputs.target_host }}"
          if [[ "$target_host" == .* || "$target_host" == *. || "$target_host" == *..* ]]; then
            echo "Invalid host format: $target_host"
            exit 1
          fi
          if [[ ! "$target_host" =~ ^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)*$ ]]; then
            echo "Invalid host format: $target_host"
            exit 1
          fi
          ping -c 4 -- "$target_host"
